[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-lab"
version = "0.1.0"
description = "Exact LOBSTER CSV loading and data quality research"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lob-lab = "lob_lab.cli:main"

[tool.setuptools.packages.find]
include = ["lob_lab*"]

